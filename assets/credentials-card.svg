<svg fill="none" viewBox="0 0 850 155" width="100%" height="155" xmlns="http://www.w3.org/2000/svg">
  <style>
    .card-bg { fill: #090A0F; stroke: rgba(197, 160, 89, 0.28); stroke-width: 1; }
    .card-accent { fill: #C5A059; opacity: 0.85; }
    .value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 19px; font-weight: 600; fill: #C5A059; letter-spacing: -0.3px; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 600; fill: #F8FAFC; letter-spacing: 1px; }
    .detail { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 400; fill: #94A3B8; }
  </style>
  
  <!-- Card 1: Springer LNEE -->
  <g transform="translate(0, 0)">
    <rect x="1" y="1" width="198" height="153" rx="6" class="card-bg" />
    <rect x="1" y="1" width="198" height="3" rx="1" class="card-accent" />
    <text x="18" y="50" class="value">Springer LNEE</text>
    <text x="18" y="76" class="label">PUBLISHED VISION PAPER</text>
    <text x="18" y="102" class="detail">YOLOv8n Fire Detection</text>
    <text x="18" y="120" class="detail">97.2% mAP@50 Accuracy</text>
  </g>
  
  <!-- Card 2: TCS PPO -->
  <g transform="translate(216, 0)">
    <rect x="1" y="1" width="198" height="153" rx="6" class="card-bg" />
    <rect x="1" y="1" width="198" height="3" rx="1" class="card-accent" />
    <text x="18" y="50" class="value">TCS PPO</text>
    <text x="18" y="76" class="label">KISAAN LLAMA OFFER</text>
    <text x="18" y="102" class="detail">Domain LLaMA-2-7B</text>
    <text x="18" y="120" class="detail">4-bit QLoRA Edge Model</text>
  </g>
  
  <!-- Card 3: IBM PBEL -->
  <g transform="translate(432, 0)">
    <rect x="1" y="1" width="198" height="153" rx="6" class="card-bg" />
    <rect x="1" y="1" width="198" height="3" rx="1" class="card-accent" />
    <text x="18" y="50" class="value">IBM PBEL</text>
    <text x="18" y="76" class="label">JUNIOR ML ENGINEER</text>
    <text x="18" y="102" class="detail">ML Data Preprocessing</text>
    <text x="18" y="120" class="detail">Latency Optimization</text>
  </g>
  
  <!-- Card 4: 200+ DSA -->
  <g transform="translate(648, 0)">
    <rect x="1" y="1" width="198" height="153" rx="6" class="card-bg" />
    <rect x="1" y="1" width="198" height="3" rx="1" class="card-accent" />
    <text x="18" y="50" class="value">200+ DSA</text>
    <text x="18" y="76" class="label">PROBLEM SOLVING</text>
    <text x="18" y="102" class="detail">LeetCode &amp; GeeksforGeeks</text>
    <text x="18" y="120" class="detail">Graphs, DP &amp; Algorithms</text>
  </g>
</svg>
