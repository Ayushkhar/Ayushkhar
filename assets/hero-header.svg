<svg fill="none" viewBox="0 0 850 160" width="100%" height="160" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #090A0F; rx: 8px; }
    .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 28px; font-weight: 300; fill: #F8FAFC; letter-spacing: -0.5px; }
    .name-bold { font-weight: 600; fill: #FFFFFF; }
    .role { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 400; fill: #C5A059; letter-spacing: 2px; text-transform: uppercase; }
    .cursor { fill: #C5A059; animation: blink 1.2s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <rect width="850" height="160" class="bg" />
  
  <!-- Subtle accent gradient rule -->
  <line x1="40" y1="36" x2="100" y2="36" stroke="#C5A059" stroke-width="2" stroke-linecap="round" />
  
  <text x="40" y="72" class="role">AI / ML Engineer &amp; Systems Architect</text>
  <text x="40" y="114" class="name">Suryansh <tspan class="name-bold">Khare</tspan></text>
  <rect x="255" y="94" width="6" height="22" class="cursor" />
</svg>
