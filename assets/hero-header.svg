<svg fill="none" viewBox="0 0 850 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #090A0F; stroke: rgba(197, 160, 89, 0.3); stroke-width: 1; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #C5A059; letter-spacing: 3.5px; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 30px; font-weight: 300; fill: #F8FAFC; letter-spacing: -0.5px; }
    .title-bold { font-weight: 700; fill: #FFFFFF; }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 400; fill: #94A3B8; letter-spacing: 0.2px; }
    .cursor { fill: #C5A059; animation: blink 1.2s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
  
  <!-- Outer container with subtle gold border -->
  <rect x="1" y="1" width="848" height="218" rx="8" class="bg" />
  
  <!-- Ambient background glow -->
  <circle cx="700" cy="40" r="140" fill="#C5A059" fill-opacity="0.06" />
  <circle cx="150" cy="180" r="120" fill="#FFFFFF" fill-opacity="0.02" />
  
  <!-- Typography Content -->
  <text x="44" y="68" class="subtitle">CURATED PORTFOLIO &amp; TECHNICAL PROFILE</text>
  <text x="44" y="118" class="title">Suryansh Khare <tspan class="title-bold">— ML &amp; Systems</tspan></text>
  <text x="44" y="160" class="tagline">Junior ML Engineer @ IBM PBEL &amp; Published AI Researcher</text>
  
  <!-- Understated typing cursor indicator -->
  <rect x="462" y="148" width="7" height="15" class="cursor" />
</svg>
