<svg fill="none" viewBox="0 0 850 180" width="100%" height="180" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0B0C10; stroke: rgba(197, 160, 89, 0.2); stroke-width: 1; }
    .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 32px; font-weight: 300; fill: #F8FAFC; letter-spacing: -0.5px; }
    .name-gold { font-weight: 500; fill: #C5A059; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 400; fill: #94A3B8; letter-spacing: 2px; text-transform: uppercase; }
    .dot { fill: #C5A059; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  </style>

  <rect x="1" y="1" width="848" height="178" rx="8" class="bg" />
  
  <!-- Subtle ambient glow -->
  <circle cx="750" cy="30" r="100" fill="#C5A059" fill-opacity="0.04" />

  <text x="48" y="75" class="sub">portfolio &amp; code</text>
  <text x="48" y="125" class="name">suryansh khare <tspan class="name-gold">.</tspan></text>
  <circle cx="280" cy="116" r="3" class="dot" />
</svg>
